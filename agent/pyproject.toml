[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-agent"
version = "0.1.0"
requires-python = ">=3.11"
# shield-common is intentionally NOT listed here: pip would look for it on the public PyPI,
# where anyone can register that name (dependency confusion). It is installed from its local path.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
